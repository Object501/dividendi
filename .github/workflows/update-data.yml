name: Update market history
run-name: Update market history (${{ inputs.source || 'manual' }})

on:
  workflow_dispatch:
    inputs:
      source:
        description: Trigger source
        required: false
        default: manual
        type: string

permissions: {}

concurrency:
  group: dividendi-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Checkout published data
        uses: actions/checkout@v7
        with:
          ref: data
          path: .published-data
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-gha-cache: true
          use-flakehub: false
          diagnostic-endpoint: ""
      - name: Restore published data
        run: |
          mkdir -p .data
          cp .published-data/history.json .data/history.json
      - name: Refresh official history
        run: nix develop --command just history
      - name: Validate and publish changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          nix develop --command just publish-data
