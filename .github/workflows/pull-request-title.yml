name: Pull request title

on:
  pull_request_target:
    types:
      - opened
      - edited
      - reopened
      - synchronize

permissions: {}

concurrency:
  group: dividendi-pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      # pull_request_target is safe here because only the trusted base is checked
      # out, and the PR title is passed as data rather than executed as code.
      - name: Normalize Dependabot title
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          title=$PR_TITLE
          if [[ "$PR_AUTHOR" == "dependabot[bot]" && "$title" != *. ]]; then
            title="$title."
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
              -f title="$title"
          fi
          printf '%s\n' "$title" > "$RUNNER_TEMP/pr-title.txt"
      - name: Checkout trusted base
        uses: actions/checkout@v6
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate title with gitlint
        run: >-
          nix develop --command pre-commit run gitlint
          --hook-stage commit-msg
          --commit-msg-filename "$RUNNER_TEMP/pr-title.txt"
